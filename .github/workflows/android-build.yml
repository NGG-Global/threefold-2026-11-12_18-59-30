name: Android build

# Builds an installable development APK of Threefold and offers it for download.
#
# It runs only when started by hand: Actions > Android build > Run workflow.
# It never runs on a commit or a pull request.
#
# Two ways to build, chosen when starting the workflow:
#   github-hosted  A GitHub Linux runner with a GameCI container. Needs Unity licence secrets
#                  and uses the organisation's Actions allowance.
#   self-hosted    A runner installed on a Windows PC that already has Unity 6000.6.0f1
#                  activated. Needs no secrets and uses no Actions minutes.
#
# Read Docs/CloudBuild.md first: it covers licensing, secrets, cost and setup for both.
# The self-hosted route has built APKs (Docs/CloudBuild.md lists the runs); the GitHub-hosted
# route has no licence secrets and has never run.
#
# On the self-hosted runner, review pictures of the Reference Courtyard can be rendered as well (input
# "review_renders"; see Docs/VisualReferencePrototype.md).
#
# On the self-hosted runner the EditMode tests can run first (input "editmode_tests"). A test
# failure does not stop the APK from being built, but it marks the run as failed, and the results
# are uploaded either way.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to build
        type: choice
        default: github-hosted
        options:
          - github-hosted
          - self-hosted
      editmode_tests:
        description: Run the EditMode tests before building (self-hosted only)
        type: boolean
        default: true
      build_apk:
        description: Build the APK (self-hosted only; untick to run only the tests, about 15 minutes)
        type: boolean
        default: true
      review_renders:
        description: Render the Reference Courtyard's review pictures (self-hosted only; Editor renders, not the game on a device)
        type: boolean
        default: false

# One Android build at a time for the whole repository. Starting a new one cancels the old one.
concurrency:
  group: android-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  github-hosted:
    name: Build APK (GitHub-hosted)
    if: inputs.runner == 'github-hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Only tests whether the secrets exist. Their values are never printed.
      - name: Check for a Unity licence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::No Unity licence secret is configured (UNITY_LICENSE or UNITY_SERIAL). See Docs/CloudBuild.md."
            exit 1
          fi
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::UNITY_EMAIL and UNITY_PASSWORD must both be configured. See Docs/CloudBuild.md."
            exit 1
          fi

      # The Android build image is about 8 GB and the build needs several more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h /

      - name: Check out repository with LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      # Unity's import cache. Without it every build re-imports the whole project.
      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Threefold-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Threefold-Android-

      # The build method assembles the playable scenes (playground, combat arena, Broken Foundry) from code,
      # validates them, applies the Android settings and builds a development APK signed with a
      # debug key.
      - name: Build development APK
        id: build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: Threefold
          buildMethod: Threefold.EditorTools.PrototypeBuild.BuildAndroid
          versioning: None
          allowDirtyBuild: true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: threefold-android-development-${{ github.run_number }}
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14

      # The build's own log and report. If Unity stopped before the build method started, for
      # example on a licence or script compilation error, these files do not exist and the
      # cause is in the "Build development APK" step output above.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threefold-android-logs-${{ github.run_number }}
          path: build/logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Android build: ${{ job.status }}"
            if ls build/Android/*.apk >/dev/null 2>&1; then
              echo "APK: $(du -h build/Android/*.apk | cut -f1). Download it from the Artifacts section of this run."
            else
              echo "No APK was produced."
            fi
            if [ -f build/logs/build-report.txt ]; then
              echo
              echo '```'
              head -n 40 build/logs/build-report.txt
              echo '```'
            else
              echo
              echo "No build report was written, so Unity stopped before the build started. See the build step's output."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  self-hosted:
    name: Build APK (self-hosted Windows)
    if: inputs.runner == 'self-hosted'
    runs-on: [self-hosted, windows, threefold-unity]
    timeout-minutes: 120
    steps:
      # The runner keeps its own copy of the repository, separate from any working copy on the PC.
      # It is not cleaned between runs, so Unity's Library folder is reused and builds stay fast.
      - name: Check out repository with LFS files
        uses: actions/checkout@v4
        with:
          lfs: true
          clean: false

      - name: Run EditMode tests
        id: tests
        if: inputs.editmode_tests
        continue-on-error: true
        shell: cmd
        env:
          UNITY_EDITOR: ${{ vars.UNITY_EDITOR_PATH }}
        run: call Tools\build\run-editmode-tests.cmd

      # Pictures of the Reference Courtyard from fixed viewpoints, drawn by Unity with a graphics device.
      # They never stop the APK from being built: a runner that cannot draw only loses the pictures.
      - name: Render review pictures
        id: renders
        if: inputs.review_renders
        continue-on-error: true
        shell: cmd
        env:
          UNITY_EDITOR: ${{ vars.UNITY_EDITOR_PATH }}
        run: call Tools\build\render-review.cmd

      - name: Upload review pictures
        if: always() && inputs.review_renders
        uses: actions/upload-artifact@v4
        with:
          name: threefold-review-renders-${{ github.run_number }}
          path: build/renders
          if-no-files-found: ignore
          retention-days: 14

      - name: Build development APK
        if: inputs.build_apk
        shell: cmd
        env:
          UNITY_EDITOR: ${{ vars.UNITY_EDITOR_PATH }}
        run: call Tools\build\build-android.cmd

      - name: Upload APK
        if: success() && inputs.build_apk
        uses: actions/upload-artifact@v4
        with:
          name: threefold-android-development-${{ github.run_number }}
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14

      # Only when a build was asked for: the runner keeps its folders, and a run without a build would
      # otherwise upload the logs of an earlier build under its own number.
      - name: Upload build logs
        if: always() && inputs.build_apk
        uses: actions/upload-artifact@v4
        with:
          name: threefold-android-logs-${{ github.run_number }}
          path: |
            build/logs
            build/android-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always() && inputs.editmode_tests
        uses: actions/upload-artifact@v4
        with:
          name: threefold-editmode-tests-${{ github.run_number }}
          path: build/tests
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail the run if the tests failed
        # !cancelled() instead of the implicit success(): the test failure is reported even if the build failed too.
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        shell: cmd
        run: |
          echo The EditMode tests failed or did not run. The APK, if any, was still built. See the test results artifact.
          exit /b 1

name: CI

# Nothing in this workflow runs until it is switched on. See Docs/DevelopmentWorkflow.md.
#
#   1. Repository checks run only when the repository variable CI_ENABLED is set to "true".
#      They need no secrets and take well under a minute.
#   2. The Unity job additionally needs a Unity licence in the repository secrets. Until one is
#      present the job is skipped, not failed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    if: vars.CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unity_ready: ${{ steps.licence.outputs.ready }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Unity repository hygiene
        run: python3 Tools/ci/check_unity_repo.py

      - name: Detect Unity licence
        id: licence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Unity licence secret is configured, so the Unity compile and test job is skipped."
          fi

  unity-tests:
    name: Unity compile and tests
    needs: repository-checks
    if: needs.repository-checks.outputs.unity_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository with LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Threefold-EditMode-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Threefold-EditMode-

      # Unity must compile every script before it can run tests, so this step is also the
      # compile check. The Editor version is read from ProjectSettings/ProjectVersion.txt.
      - name: Compile and run Edit Mode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          if-no-files-found: warn
          retention-days: 14
